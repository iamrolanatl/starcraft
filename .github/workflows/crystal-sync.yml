# Builds Crystal Sync installers (unsigned) for macOS, Windows and Linux.
# Trigger: push a tag like crystal-sync-v0.1.0, or run manually. Artifacts are attached to the workflow run (and to a
# GitHub Release on tags). Because the repo is private, copy the files into public/downloads/ and deploy Pages so parents can download.
name: crystal-sync
on:
  workflow_dispatch:
  push:
    tags: ["crystal-sync-v*"]
    paths: ["agent/**", ".github/workflows/crystal-sync.yml"]
permissions: { contents: write }
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14, name: macOS }
          - { os: windows-latest, name: Windows }
          - { os: ubuntu-22.04, name: Linux }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: agent, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: echo "CS_VER=$(python -c 'import crystal_sync;print(crystal_sync.__version__)')" >> $GITHUB_ENV
      - name: selftest (parser, no network)
        run: python -c "import crystal_sync.engine, crystal_sync.wizard, crystal_sync.schedule; print('import ok')"
      - name: macOS app + dmg + pkg
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --windowed --name "Crystal Sync" --osx-bundle-identifier com.crystal.sync --collect-submodules crystal_sync --hidden-import keyring.backends.macOS packaging/entry.py
          mkdir -p dmg && cp -R "dist/Crystal Sync.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Crystal Sync" -srcfolder dmg -ov -format UDZO "dist/CrystalSync-$CS_VER-macOS.dmg"
          pkgbuild --install-location /Applications --component "dist/Crystal Sync.app" "dist/CrystalSync-$CS_VER-macOS.pkg"
          # TODO signing: codesign --deep --options runtime -s "Developer ID Application: …" ; xcrun notarytool submit … --wait ; xcrun stapler staple
      - name: Windows exe + installer
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconfirm --onefile --noconsole --name CrystalSync --collect-submodules crystal_sync --hidden-import keyring.backends.Windows packaging/entry.py
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" packaging/windows.iss
          # TODO signing: signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f cert.pfx …
      - name: Linux AppImage + deb
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq file libfuse2 && PY=python bash packaging/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CrystalSync-${{ matrix.name }}
          path: |
            agent/dist/*.dmg
            agent/dist/*.pkg
            agent/dist/*-Setup.exe
            agent/dist/*.AppImage
            agent/dist/*.deb
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            agent/dist/*.dmg
            agent/dist/*.pkg
            agent/dist/*-Setup.exe
            agent/dist/*.AppImage
            agent/dist/*.deb
