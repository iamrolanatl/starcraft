name = "crystal"
pages_build_output_dir = "out"
compatibility_date = "2025-09-01"

[ai]
binding = "AI"

# Global rate limiter (Durable Object in workers/ratelimiter, deployed separately)
[[durable_objects.bindings]]
name = "RL"
class_name = "RateLimiter"
script_name = "crystal-ratelimiter"

# Hard chat questions -> box worker (sync/escalation_worker.py pulls via the HTTP pull consumer)
[[queues.producers]]
queue = "crystal-escalations"
binding = "ESCALATIONS"
